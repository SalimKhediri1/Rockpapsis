<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="game">
        <section class="hero">
            <p class="eyebrow">First to 5 wins</p>
            <h1>Rock Paper Scissors</h1>
            <p class="intro">Pick your move and try to outsmart the computer.</p>
        </section>

        <section class="arena" aria-live="polite">
            <div class="scoreboard">
                <div class="score-card player-score">
                    <span>You</span>
                    <strong id="player-score">0</strong>
                </div>
                <div class="round-badge">Round <span id="round-number">1</span></div>
                <div class="score-card computer-score">
                    <span>Computer</span>
                    <strong id="computer-score">0</strong>
                </div>
            </div>

            <div id="result" class="result-panel">Choose Rock, Paper, or Scissors!</div>

            <div id="game-controls" class="choices" aria-label="Choose your move">
                <button id="rock" class="choice-button" type="button">
                    <span class="choice-icon">🪨</span>
                    <span>Rock</span>
                </button>
                <button id="paper" class="choice-button" type="button">
                    <span class="choice-icon">📄</span>
                    <span>Paper</span>
                </button>
                <button id="scissors" class="choice-button" type="button">
                    <span class="choice-icon">✂️</span>
                    <span>Scissors</span>
                </button>
            </div>

            <button id="reset" class="reset-button" type="button">Play again</button>
        </section>

        <section class="history-panel" aria-labelledby="history-title">
            <h2 id="history-title">Round history</h2>
            <ol id="history" class="history-list"></ol>
        </section>
    </main>
    <script src="java.js"></script>
</body>
</html>
